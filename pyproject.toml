[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "azeroth-capital"
version = "0.1.0"
description = "World of Warcraft Auction House market-data collector and quantitative research toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "typer>=0.12,<1",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ac = "azeroth_capital.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/azeroth_capital"]
